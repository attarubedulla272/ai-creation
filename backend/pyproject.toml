[project]
name = "ai-creator-studio-backend"
version = "0.1.0"
description = "FastAPI foundation for AI Creator Studio"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "argon2-cffi>=23.1,<26",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pillow>=10,<13",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.9,<1",
    "PyJWT>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "redis>=5,<7",
    "scenedetect>=0.6.7,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
    "psycopg[binary]>=3.3.8",
    "cryptography>=44,<47",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]
voice-mlx = [
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
