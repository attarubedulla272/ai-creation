[project]
name = "ai-creator-studio-translation-worker"
version = "0.1.0"
description = "Optional isolated IndicTrans2 translation worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "indictranstoolkit==1.1.1",
    "numpy>=2.1,<3",
    "sentencepiece>=0.2,<1",
    "torch>=2.5,<3",
    "transformers>=4.51,<5",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
